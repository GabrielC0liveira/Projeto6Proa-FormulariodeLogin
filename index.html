<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto6-Formulário de Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="embrulho">
    <div class="titulo"><span>Login</span></div>
    <form action="#">
      <div class="linha">
        <i class="fas fa-user"></i>
        <input type="text" placeholder="Email ou telefone" required />
      </div>
      <div class="linha">
        <i class="fas fa-lock"></i>
        <input type="password" placeholder="Senha" required />
      </div>
      <div class="senha"><a href="#">Esqueceu sua senha?</a></div>
      <div class="linha botao">
        <input type="submit" value="Login" />
      </div>
      <div class="criar-link">Não tem conta? <a href="#">Cadastre-se</a></div>
    </form>
  </div>
</body>
</html>
